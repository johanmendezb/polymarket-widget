name: Setup Node and pnpm
description: >-
  Installs pnpm (version from package.json packageManager), Node (version from
  .nvmrc) with a warm pnpm store cache, then installs from the frozen lockfile.

runs:
  using: composite
  steps:
    # pnpm must exist before setup-node, or `cache: pnpm` has no store to find.
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
